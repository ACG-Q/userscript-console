name: 'Userscript Console'
description: '油猴脚本控制台：命令执行 / Issue 投影 / 站点构建 / 面板清理 / 数据自检'
branding:
  icon: terminal
  color: green

# ── 版本策略（SPEC-ACTION §5） ────────────────────────────────
#
# 两种执行模式，由 use-binary 切换：
#   false（默认）: 源码模式 —— setup-go + go run ./cmd/usm
#                   始终跟随本 commit 的源码，改代码即生效，无需发版。
#   true: 二进制模式 —— 从 release 下载 usm-linux-amd64 + sha256 校验。
#          更快（免编译），但版本由 binary-version 决定，与本 commit 无关。
#
# 二进制版本与校验和**由调用方显式传入**（inputs），不从本文件读取：
#   原因：版本号只有打完 tag 才知道，若让 release CI 回填本文件，
#   就会形成「tag → 回填 → 再发布」的循环依赖（v1.0.1 实测卡死在
#   「写回 action.yml」这一步）。改为调用方声明后，release 退化为
#   纯发布，永不回填本文件。
#
# 调用方一律 pin commit-sha：uses: acg-q/userscript-console@<40位sha>
# 外部调用方可使用 v1 tag：uses: acg-q/userscript-console@v1

inputs:
  command:
    description: 'run-command | project | build | cleanup | doctor'
    required: true
  github-token:
    description: 'GITHUB_TOKEN（composite 无法读 secrets，必须显式传入）'
    required: true
  comment-body:
    description: '仅 run-command：评论正文'
    default: ''
  comment-user:
    description: '仅 run-command：评论者 login'
    default: ''
  repo-owner:
    description: '门禁比较对象'
    default: ${{ github.repository_owner }}
  issue-number:
    description: '仅 run-command：命令面板 Issue 号'
    default: '1'
  registry-schema-version:
    description: '跨仓 schema 防漂移；不匹配 → 失败'
    default: '1'
  keep:
    description: '仅 cleanup：保留命令组数'
    default: '10'
  apply:
    description: '仅 cleanup：必须显式 true 才真正删除（默认 dry-run）'
    default: 'false'
  version:
    description: '二进制版本别名（等价于 binary-version，保留以兼容早期调用方）'
    default: ''

  use-binary:
    description: 'true=下载 release 二进制（需同时给 binary-version/binary-sha256）；false=源码模式（默认）'
    default: 'false'
  binary-version:
    description: '二进制版本号（不含 v），仅 use-binary=true 时必填。取自对应 release 的 tag，如 1.0.0'
    default: ''
  binary-sha256:
    description: '二进制 sha256（64 位十六进制），仅 use-binary=true 时必填。取自 release 资产的 checksums.txt'
    default: ''

outputs:
  authorized:
    description: '仅 run-command：权限门禁结果 true/false'
    value: ${{ steps.run.outputs.authorized }}
  changed:
    description: '本次是否改动数据文件（决定调用方是否 commit）'
    value: ${{ steps.run.outputs.changed }}
  result:
    description: '回帖正文（人类可读，多行）'
    value: ${{ steps.run.outputs.result }}
  warnings:
    description: "build 的告警（单行化，%0A 分隔）"
    value: ${{ steps.run.outputs.warnings }}

runs:
  using: composite
  steps:
    # ── 二进制模式：下载 + 校验（use-binary=true） ──────────────
    - name: Fetch binary
      id: fetch
      if: ${{ inputs.use-binary == 'true' }}
      shell: bash
      env:
        # 版本：binary-version 为主，version 作为兼容别名
        WANT_VERSION: ${{ inputs.binary-version != '' && inputs.binary-version || inputs.version }}
        WANT_SHA256: ${{ inputs.binary-sha256 }}
      run: |
        set -euo pipefail
        DEST="$RUNNER_TEMP/usm"

        # 两个参数都是调用方责任 —— 缺失即报明确错误，
        # 而不是发出畸形 URL 让 curl 报 404（难以定位）。
        if [ -z "$WANT_VERSION" ]; then
          echo "::error::use-binary=true 时必须提供 binary-version（如 1.0.0）"
          exit 1
        fi
        if ! printf '%s' "$WANT_SHA256" | grep -Eq '^[0-9a-f]{64}$'; then
          echo "::error::use-binary=true 时必须提供 binary-sha256（64 位十六进制，取自 release 的 checksums.txt）"
          echo "::error::当前值='$WANT_SHA256'"
          exit 1
        fi

        URL="https://github.com/${{ github.repository_owner }}/userscript-console/releases/download/v${WANT_VERSION}/usm-linux-amd64"
        echo "下载: $URL"
        curl -fsSL --retry 3 --retry-delay 2 -o "$DEST" "$URL"

        ACTUAL=$(sha256sum "$DEST" | awk '{print $1}')
        if [ "$ACTUAL" != "$WANT_SHA256" ]; then
          echo "::error::二进制 SHA256 不匹配（期望=$WANT_SHA256 实际=$ACTUAL）"
          echo "::error::若刚发了新版本，请从 release 资产的 checksums.txt 更新 binary-sha256"
          exit 1
        fi
        echo "SHA256 校验通过: $ACTUAL"

        chmod +x "$DEST"
        "$DEST" version          # 冒烟：能自报版本
        echo "path=$DEST" >> "$GITHUB_OUTPUT"

    # ── 源码模式：跟随本 commit（use-binary=false，默认） ───────
    - name: Setup Go
      if: ${{ inputs.use-binary != 'true' }}
      uses: actions/setup-go@v6
      with:
        go-version-file: ${{ github.action_path }}/go.mod
        cache-dependency-path: ${{ github.action_path }}/go.sum

    - name: Run
      id: run
      shell: bash
      env:
        # 关键安全约定：用户输入只经 env 进入，绝不内插进 shell 命令行（SPEC-ACTION §4.2）
        GITHUB_TOKEN: ${{ inputs.github-token }}
        GITHUB_REPOSITORY: ${{ github.repository }}
        COMMENT_BODY: ${{ inputs.comment-body }}
        COMMENT_USER: ${{ inputs.comment-user }}
        REPO_OWNER: ${{ inputs.repo-owner }}
        ISSUE_NUMBER: ${{ inputs.issue-number }}
        USM_REGISTRY_SCHEMA: ${{ inputs.registry-schema-version }}
        USM_KEEP: ${{ inputs.keep }}
        USM_APPLY: ${{ inputs.apply }}
        USM_ROOT: ${{ github.workspace }}
        # 二进制模式下由 Fetch 步骤产出；源码模式为空
        USM_BIN: ${{ steps.fetch.outputs.path }}
      run: |
        set -euo pipefail
        USM_ACTION_PATH="${{ github.action_path }}"

        # PAGES_BASE 自动推导：https://<owner>.github.io/<repo>
        # GITHUB_REPOSITORY 格式为 "owner/repo"，把 / 换成 -（github.io 的写法）
        : "${PAGES_BASE:=https://${GITHUB_REPOSITORY/\//-}.github.io}"
        export PAGES_BASE

        # 子命令白名单（未知值 exit 2；不拼接用户输入）
        case "${{ inputs.command }}" in
          run-command) CMD=(run-command) ;;
          project)     CMD=(project) ;;
          build)       CMD=(build) ;;
          cleanup)     CMD=(cleanup --keep "$USM_KEEP")
                       [ "$USM_APPLY" = "true" ] && CMD+=(--apply) || true ;;
          doctor)      CMD=(doctor --check) ;;
          *) echo "未知 command: ${{ inputs.command }}" >&2; exit 2 ;;
        esac

        # 两种模式都必须输出合法 JSON —— action.yml 用 jq 解析它。
        # 契约由 cmd/usm/json_output_test.go 锁定。
        rc=0
        if [ -n "$USM_BIN" ]; then
          "$USM_BIN" "${CMD[@]}" --json > usm-out.json || rc=$?
        else
          ( cd "$USM_ACTION_PATH" && go run ./cmd/usm "${CMD[@]}" --json ) > usm-out.json || rc=$?
        fi

        # 输出块：先校验 JSON 合法性，非法就立刻报错，
        # 绝不让脏数据流进 $GITHUB_OUTPUT（否则 heredoc 解析会连带失败）。
        if [ -s usm-out.json ]; then
          if ! jq -e . usm-out.json >/dev/null 2>&1; then
            echo "::error::usm 输出非法 JSON：" >&2
            cat usm-out.json >&2
            exit 6
          fi

          # heredoc 分隔符只求值一次并复用；每字段单独 append。
          EOF_ID="USM_EOF_$(date +%s%N)"

          printf 'changed=%s\n'    "$(jq -r '.changed // false'  usm-out.json)" >> "$GITHUB_OUTPUT"
          printf 'authorized=%s\n' "$(jq -r '.authorized // true' usm-out.json)" >> "$GITHUB_OUTPUT"

          {
            printf 'warnings<<%s\n' "$EOF_ID"
            jq -r '.warnings | if type == "array" then join("\n") elif type == "string" then . else empty end' usm-out.json
            printf '%s\n' "$EOF_ID"
          } >> "$GITHUB_OUTPUT"

          {
            printf 'result<<%s\n' "$EOF_ID"
            jq -r '.result // empty' usm-out.json
            printf '%s\n' "$EOF_ID"
          } >> "$GITHUB_OUTPUT"
        fi

        if [ "$rc" -ne 0 ]; then
          echo "usm 退出码 $rc" >&2
          [ -s usm-out.json ] && jq -r 'if .errors then (.errors[] | "ERROR: \(.)") else empty end' usm-out.json >&2 || true
          echo "--- usm-out.json ---" >&2
          cat usm-out.json >&2
          exit "$rc"
        fi