name: 'Userscript Console'
description: '油猴脚本控制台：命令执行 / Issue 投影 / 站点构建 / 面板清理 / 数据自检'
branding:
  icon: terminal
  color: green

# ── 版本策略（SPEC-ACTION §5） ────────────────────────────────
#
# 两种执行模式，由 use-binary 切换：
#   false（默认）: 源码模式 —— setup-go + go run ./cmd/usm
#                   始终跟随本 commit 的源码，改代码即生效，无需发版。
#   true: 二进制模式 —— 从 release 下载 usm-linux-amd64 + sha256 校验。
#          更快（免编译），但版本由 binary-version 决定，与本 commit 无关。
#
# 二进制版本与校验和**由调用方显式传入**（inputs），**缺省时自动推导**：
#   1) binary-version/version 显式值 → 直接使用（sha-pin 调用方不变）
#   2) ACTION_REF 精确 vX.Y.Z（如 @v1.1.0） → 去 v 使用（**核心：只写 tag 即可**）
#   3) ACTION_REF 大版本 tag（v1） → GitHub API 取最新 v1.x release
#   4) 其他（sha/分支/本地路径）→ 明确报错，提示显式传 binary-version 或改源码模式
# 校验和同理：binary-sha256 显式 > 从同 release 的 checksums.txt 自动取
#
# 调用方一律 pin commit-sha：uses: acg-q/userscript-console@<40位sha>
# 外部调用方可使用 v1 tag：uses: acg-q/userscript-console@v1（零手填二进制）
# 也可显式 @vX.Y.Z：uses: acg-q/userscript-console@vX.Y.Z（零手填二进制）

inputs:
  command:
    description: 'run-command | project | build | cleanup | doctor'
    required: true
  github-token:
    description: 'GITHUB_TOKEN（composite 无法读 secrets，必须显式传入）'
    required: true
  comment-body:
    description: '仅 run-command：评论正文'
    default: ''
  comment-user:
    description: '仅 run-command：评论者 login'
    default: ''
  repo-owner:
    description: '门禁比较对象'
    default: ${{ github.repository_owner }}
  issue-number:
    description: '仅 run-command：命令面板 Issue 号'
    default: '1'
  registry-schema-version:
    description: '跨仓 schema 防漂移；不匹配 → 失败'
    default: '1'
  keep:
    description: '仅 cleanup：保留命令组数'
    default: '10'
  apply:
    description: '仅 cleanup：必须显式 true 才真正删除（默认 dry-run）'
    default: 'false'
  version:
    description: '二进制版本别名（等价于 binary-version，保留以兼容早期调用方）'
    default: ''

  use-binary:
    description: 'true=下载 release 二进制（缺省自动推导版本+校验和，或显式给 binary-version/binary-sha256）；false=源码模式（默认）'
    default: 'false'
  binary-version:
    description: '二进制版本号（不含 v）。缺省时从 ACTION_REF 推导：精确 vX.Y.Z tag 直接用；大版本 vN 取最新 vN.x release。显式传值可覆盖。'
    default: ''
  binary-sha256:
    description: '二进制 sha256（64 位十六进制）。缺省时从同 release 的 checksums.txt 自动取 usm-linux-amd64 校验和。显式传值可收紧。'
    default: ''

outputs:
  authorized:
    description: '仅 run-command：权限门禁结果 true/false'
    value: ${{ steps.run.outputs.authorized }}
  changed:
    description: '本次是否改动数据文件（决定调用方是否 commit）'
    value: ${{ steps.run.outputs.changed }}
  result:
    description: '回帖正文（人类可读，多行）'
    value: ${{ steps.run.outputs.result }}
  warnings:
    description: "build 的告警（单行化，%0A 分隔）"
    value: ${{ steps.run.outputs.warnings }}

runs:
  using: composite
  steps:
    # ── 二进制模式：下载 + 校验（use-binary=true） ──────────────
    - name: Fetch binary
      id: fetch
      if: ${{ inputs.use-binary == 'true' }}
      shell: bash
      env:
        # 版本：binary-version 为主，version 作为兼容别名；缺省时从 action 自身 ref 推导
        WANT_VERSION: ${{ inputs.binary-version != '' && inputs.binary-version || inputs.version }}
        WANT_SHA256: ${{ inputs.binary-sha256 }}
        ACTION_REF: ${{ github.action_ref }}
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        DEST="$RUNNER_TEMP/usm"

        # ── 版本推导（仅在显式版本为空时） ──────────────────────
        if [ -z "$WANT_VERSION" ]; then
          if printf '%s' "$ACTION_REF" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            # 精确语义化版本 tag（如 @v1.1.0）→ 去 v
            WANT_VERSION="${ACTION_REF#v}"
            echo "binary-version 未显式提供，从 action ref ($ACTION_REF) 推导: $WANT_VERSION"
          elif printf '%s' "$ACTION_REF" | grep -Eq '^v[0-9]+$'; then
            # 大版本 tag（如 @v1）→ 调用 GitHub API 取最新该大版本 release
            MAJOR="${ACTION_REF#v}"
            echo "检测到大版本 tag ($ACTION_REF)，查询最新 v${MAJOR}.x release..."
            LATEST_TAG=$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" \
              "https://api.github.com/repos/ACG-Q/userscript-console/releases?per_page=20" \
              | jq -r "map(select(.tag_name | startswith(\"v${MAJOR}.\"))) | .[0].tag_name // empty")
            if [ -z "$LATEST_TAG" ]; then
              echo "::error::无法解析最新 v${MAJOR}.x release（API 返回空）。请显式传 binary-version: 'X.Y.Z'。"
              exit 1
            fi
            WANT_VERSION="${LATEST_TAG#v}"
            echo "大版本 tag 推导到最新 release: v${WANT_VERSION}"
          else
            # sha / 分支 / 本地路径 / 空 → 无法推导
            echo "::error::use-binary=true 且无法从 action ref 推导版本（ACTION_REF='$ACTION_REF'）。"
            echo "::error::请显式传 binary-version: 'X.Y.Z'（如 1.1.0），或改用源码模式 use-binary: false。"
            exit 1
          fi
        fi

        # ── 校验和推导（仅在显式 sha 为空时） ───────────────────
        if [ -z "$WANT_SHA256" ]; then
          CS_URL="https://github.com/ACG-Q/userscript-console/releases/download/v${WANT_VERSION}/checksums.txt"
          echo "binary-sha256 未显式提供，从 release 资产下载 checksums.txt: $CS_URL"
          curl -fsSL --retry 3 --retry-delay 2 -o "$DEST.checksums" "$CS_URL"
          WANT_SHA256=$(awk '/usm-linux-amd64$/{print $1}' "$DEST.checksums" | head -n1)
          if [ -z "$WANT_SHA256" ]; then
            echo "::error::checksums.txt 中未找到 usm-linux-amd64 的校验和"
            exit 1
          fi
          echo "从 checksums.txt 解析到 sha256: $WANT_SHA256"
        fi

        # ── 统一校验：版本非空 + sha 64位十六进制 ──────────────
        if [ -z "$WANT_VERSION" ]; then
          echo "::error::版本解析后仍为空（内部错误）"
          exit 1
        fi
        if ! printf '%s' "$WANT_SHA256" | grep -Eq '^[0-9a-f]{64}$'; then
          echo "::error::binary-sha256 必须是 64 位十六进制（显式值或 checksums.txt 解析结果）"
          echo "::error::当前值='$WANT_SHA256'"
          exit 1
        fi

        URL="https://github.com/ACG-Q/userscript-console/releases/download/v${WANT_VERSION}/usm-linux-amd64"
        echo "下载: $URL"
        curl -fsSL --retry 3 --retry-delay 2 -o "$DEST" "$URL"

        ACTUAL=$(sha256sum "$DEST" | awk '{print $1}')
        if [ "$ACTUAL" != "$WANT_SHA256" ]; then
          echo "::error::二进制 SHA256 不匹配（期望=$WANT_SHA256 实际=$ACTUAL）"
          echo "::error::若刚发了新版本，请从 release 资产的 checksums.txt 更新 binary-sha256"
          exit 1
        fi
        echo "SHA256 校验通过: $ACTUAL"

        chmod +x "$DEST"
        "$DEST" version          # 冒烟：能自报版本
        echo "path=$DEST" >> "$GITHUB_OUTPUT"

    # ── 源码模式：跟随本 commit（use-binary=false，默认） ───────
    - name: Setup Go
      if: ${{ inputs.use-binary != 'true' }}
      uses: actions/setup-go@v6
      with:
        go-version-file: ${{ github.action_path }}/go.mod
        cache-dependency-path: ${{ github.action_path }}/go.sum

    - name: Run
      id: run
      shell: bash
      env:
        # 关键安全约定：用户输入只经 env 进入，绝不内插进 shell 命令行（SPEC-ACTION §4.2）
        GITHUB_TOKEN: ${{ inputs.github-token }}
        GITHUB_REPOSITORY: ${{ github.repository }}
        COMMENT_BODY: ${{ inputs.comment-body }}
        COMMENT_USER: ${{ inputs.comment-user }}
        REPO_OWNER: ${{ inputs.repo-owner }}
        ISSUE_NUMBER: ${{ inputs.issue-number }}
        USM_REGISTRY_SCHEMA: ${{ inputs.registry-schema-version }}
        USM_KEEP: ${{ inputs.keep }}
        USM_APPLY: ${{ inputs.apply }}
        USM_ROOT: ${{ github.workspace }}
        # 二进制模式下由 Fetch 步骤产出；源码模式为空
        USM_BIN: ${{ steps.fetch.outputs.path }}
      run: |
        set -euo pipefail
        USM_ACTION_PATH="${{ github.action_path }}"

        # PAGES_BASE 自动推导：https://<owner>.github.io/<repo>
        # GITHUB_REPOSITORY 格式为 "owner/repo"
        owner_repo=(${GITHUB_REPOSITORY//\// })
        owner="${owner_repo[0]}"
        repo="${owner_repo[1]}"
        : "${PAGES_BASE:=https://${owner}.github.io/${repo}}"
        export PAGES_BASE

        # 子命令白名单（未知值 exit 2；不拼接用户输入）
        case "${{ inputs.command }}" in
          run-command) CMD=(run-command) ;;
          project)     CMD=(project) ;;
          build)       CMD=(build) ;;
          cleanup)     CMD=(cleanup --keep "$USM_KEEP")
                       [ "$USM_APPLY" = "true" ] && CMD+=(--apply) || true ;;
          doctor)      CMD=(doctor --check) ;;
          *) echo "未知 command: ${{ inputs.command }}" >&2; exit 2 ;;
        esac

        # 两种模式都必须输出合法 JSON —— action.yml 用 jq 解析它。
        # 契约由 cmd/usm/json_output_test.go 锁定。
        rc=0
        if [ -n "$USM_BIN" ]; then
          "$USM_BIN" "${CMD[@]}" --json > usm-out.json || rc=$?
        else
          ( cd "$USM_ACTION_PATH" && go run ./cmd/usm "${CMD[@]}" --json ) > usm-out.json || rc=$?
        fi

        # 输出块：先校验 JSON 合法性，非法就立刻报错，
        # 绝不让脏数据流进 $GITHUB_OUTPUT（否则 heredoc 解析会连带失败）。
        if [ -s usm-out.json ]; then
          if ! jq -e . usm-out.json >/dev/null 2>&1; then
            echo "::error::usm 输出非法 JSON：" >&2
            cat usm-out.json >&2
            exit 6
          fi

          # heredoc 分隔符只求值一次并复用；每字段单独 append。
          EOF_ID="USM_EOF_$(date +%s%N)"

          printf 'changed=%s\n'    "$(jq -r '.changed // false'  usm-out.json)" >> "$GITHUB_OUTPUT"
          printf 'authorized=%s\n' "$(jq -r '.authorized // true' usm-out.json)" >> "$GITHUB_OUTPUT"

          {
            printf 'warnings<<%s\n' "$EOF_ID"
            jq -r '.warnings | if type == "array" then join("\n") elif type == "string" then . else empty end' usm-out.json
            printf '%s\n' "$EOF_ID"
          } >> "$GITHUB_OUTPUT"

          {
            printf 'result<<%s\n' "$EOF_ID"
            jq -r '.result // empty' usm-out.json
            printf '%s\n' "$EOF_ID"
          } >> "$GITHUB_OUTPUT"
        fi

        if [ "$rc" -ne 0 ]; then
          echo "usm 退出码 $rc" >&2
          [ -s usm-out.json ] && jq -r 'if .errors then (.errors[] | "ERROR: \(.)") else empty end' usm-out.json >&2 || true
          echo "--- usm-out.json ---" >&2
          cat usm-out.json >&2
          exit "$rc"
        fi