name: Release

# C4-1/C4-2/C4-3：tag vX.Y.Z → 跨平台二进制 + checksums.txt → 发布 release
#                  → 移动 v1 大版本 tag。
#
# 设计要点：
#   1. build matrix 只负责编译并上传 artifact（并发安全，无 release 竞争）
#   2. publish 单 job 汇总所有平台 → 生成 checksums.txt → 发布
#   3. **不回填 action.yml** —— 版本号只有打完 tag 才知道，回填会形成
#      「tag → 回填 → 推分支 → tag 语义被污染」的循环依赖（v1.0.1 实测卡死）。
#      action.yml 不持有任何版本常量；binary-version / binary-sha256
#      由调用方在 workflow 里显式声明（release 会打印现成的配置片段）。
#   4. concurrency 防止同 tag 重跑互相覆盖

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      tag:
        description: '要发布的 tag（vX.Y.Z）'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  # 供所有 job 复用。workflow_dispatch 时用 inputs.tag，否则用触发 ref 的 tag 名。
  # 注意：GitHub Actions 表达式没有 replace()，去 v 前缀在各 job 的 shell 里做
  # （见「去 v 前缀」步骤），此处保留原始值。
  USM_VERSION: ${{ inputs.tag != '' && inputs.tag || github.ref_name }}

jobs:
  # ── 1. 编译矩阵（并发安全） ────────────────────────────────────
  build:
    name: build ${{ matrix.goos }}-${{ matrix.goarch }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: linux,   goarch: amd64, suffix: '' }
          - { goos: linux,   goarch: arm64, suffix: '' }
          - { goos: windows, goarch: amd64, suffix: '.exe' }
          - { goos: darwin,  goarch: arm64, suffix: '' }
          - { goos: darwin,  goarch: amd64, suffix: '' }
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0   # 需完整历史供 publish 侧 commit

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: 去 v 前缀
        id: ver
        shell: bash
        run: |
          set -euo pipefail
          RAW="${{ env.USM_VERSION }}"
          # 校验 tag 形如 vX.Y.Z（防止误打 vfoo 之类）
          if ! printf '%s' "$RAW" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::tag 形如 vX.Y.Z，当前=$RAW"
            exit 1
          fi
          NO_V="${RAW#v}"
          echo "raw=$RAW" >> "$GITHUB_OUTPUT"
          echo "no_v=$NO_V" >> "$GITHUB_OUTPUT"

      - name: 编译
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
          VERSION: ${{ steps.ver.outputs.no_v }}
        run: |
          set -euo pipefail
          NAME="usm-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.suffix }}"
          mkdir -p dist
          go build -trimpath \
            -ldflags "-s -w -X main.version=${VERSION}" \
            -o "dist/${NAME}" ./cmd/usm
          # 冒烟：二进制能自报版本
          if [ "${{ matrix.goos }}" = "linux" ] && [ "${{ matrix.goarch }}" = "amd64" ]; then
            ./dist/"$NAME" version
          fi
          ls -l "dist/${NAME}"

      - uses: actions/upload-artifact@v4
        with:
          name: usm-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/usm-*
          retention-days: 1
          if-no-files-found: error

  # ── 2. 汇总 + 校验和 + 发布（不回填 action.yml） ─────────────
  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.ref }}

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: 去 v 前缀
        id: ver
        shell: bash
        run: |
          set -euo pipefail
          RAW="${{ env.USM_VERSION }}"
          # 校验 tag 形如 vX.Y.Z（防止误打 vfoo 之类导致 release URL 错乱）
          if ! printf '%s' "$RAW" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::tag 必须形如 vX.Y.Z，当前=$RAW"
            exit 1
          fi
          echo "raw=$RAW" >> "$GITHUB_OUTPUT"
          echo "no_v=${RAW#v}" >> "$GITHUB_OUTPUT"

      - name: 收集所有平台产物
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: usm-*
          merge-multiple: true

      - name: 生成 checksums.txt
        run: |
          set -euo pipefail
          cd dist
          ls -1
          sha256sum usm-* > checksums.txt
          echo "--- checksums.txt ---"
          cat checksums.txt

      - name: 自校验 —— 二进制与 v1 引用一致
        run: |
          set -euo pipefail
          EXPECTED=$(grep 'usm-linux-amd64$' dist/checksums.txt | awk '{print $1}')
          ACTUAL=$(sha256sum dist/usm-linux-amd64 | awk '{print $1}')
          if [ "$EXPECTED" != "$ACTUAL" ]; then
            echo "::error::checksums.txt 与实际产物不符（清单=$EXPECTED 实际=$ACTUAL）"
            exit 1
          fi
          echo "linux-amd64 SHA256: $ACTUAL"

      # ⚠️ 不再回填 action.yml（v1.0.1 实测卡死在这里）。
      #
      # 原设计让本步骤把版本号 + sha256 写回 action.yml 的 inputs.default，
      # 但那会形成循环依赖：版本号只有打完 tag 才知道 → tag 触发本 workflow
      # → 本 workflow 想推 tag 所在分支 → 分支已含写回 → tag 语义被污染。
      # 且实测正则还需跨过 description 行，漏了就在此静默 exit 1。
      #
      # 现在 action.yml 不存任何版本常量，缺省时从 ACTION_REF 自动推导：
      #   1) binary-version/binary-sha256 显式值 → 直接用（内容仓 sha-pin 惯例）
      #   2) ACTION_REF 精确 vX.Y.Z（如 @v1.1.0） → 去 v 使用
      #   3) ACTION_REF 大版本 vN（如 @v1） → GitHub API 取最新 vN.x release
      # 校验和同理：binary-sha256 显式 > 从同 release checksums.txt 自动取。
      - name: 输出调用方配置片段
        env:
          VERSION: ${{ steps.ver.outputs.no_v }}
        run: |
          set -euo pipefail
          SHA=$(grep 'usm-linux-amd64$' dist/checksums.txt | awk '{print $1}')
          cat <<EOF

          ── 调用方（userscripts）配置片段 ──────────────────────────
          用 release \(v${VERSION}) 时，只需在 workflow 里写 tag，**无需再手填版本/校验和**：

          # 源码模式（默认，始终跟随 commit 源码）
          uses: acg-q/userscript-console@v${VERSION}
          with:
            command: build
            github-token: \${{ secrets.GITHUB_TOKEN }}

          # 二进制模式 + 自动推导（零手填）
          uses: acg-q/userscript-console@v${VERSION}
          with:
            command: build
            github-token: \${{ secrets.GITHUB_TOKEN }}
            use-binary: true
            # binary-version 与 binary-sha256 自动从 @v${VERSION} 推导

          # 二进制模式 + 大版本 tag（@v1 取最新 v1.x）
          uses: acg-q/userscript-console@v1
          with:
            command: build
            github-token: \${{ secrets.GITHUB_TOKEN }}
            use-binary: true

          # 显式 pin sha + 显式二进制版本（内容仓安全惯例）
          uses: acg-q/userscript-console@<40位sha>
          with:
            command: build
            github-token: \${{ secrets.GITHUB_TOKEN }}
            use-binary: true
            binary-version: '${VERSION}'
            binary-sha256: '${SHA}'

          sha256 也可从 release 资产直接取：
              curl -sL https://github.com/ACG-Q/userscript-console/releases/download/v${VERSION}/checksums.txt | grep usm-linux-amd64
          ──────────────────────────────────────────────────────────
          EOF

      - name: 发布 release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ env.USM_VERSION }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release $TAG 已存在，改为覆盖资产"
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* \
              --title "usm $TAG" \
              --generate-notes \
              --verify-tag
          fi
          echo "--- release 资产 ---"
          gh release view "$TAG" --json assets --jq '.assets[].name'

  # ── 3. 移动 v1 大版本 tag（SPEC-ACTION §5） ─────────────────────
  move-v1-tag:
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0   # 关键：原版缺这一步，git fetch --tags 会失败

      - name: 移动 v1 大版本 tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ env.USM_VERSION }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch --tags --force
          git tag -f v1 "$TAG"
          git push -f origin refs/tags/v1
          echo "v1 -> $TAG"