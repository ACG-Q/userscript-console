name: Test

on:
  push:
    branches: [master]
  pull_request: {}

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: 格式（gofumpt 目标，先用 gofmt 把关）
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then echo "gofmt 需要格式化:"; echo "$out"; exit 1; fi

      - name: vet
        run: go vet ./...

      - name: 测试 + 覆盖率
        run: |
          go test ./... -covermode=atomic -coverprofile=cover.out
          go tool cover -func=cover.out
          echo "--- total line ---"
          go tool cover -func=cover.out | tail -1
          pct=$(go tool cover -func=cover.out | tail -1 | grep -oE '[0-9.]+%' | tr -d '%')
          echo "pct='$pct'"
          awk -v p="$pct" 'BEGIN{exit !(p>=90)}'
          echo "coverage gate passed"

      - name: 快照基线
        run: go run ./cmd/usm snapshot check

      - name: 数据自检
        run: |
          if [ -f registry.json ]; then
            go run ./cmd/usm doctor --check
          else
            echo "本仓不持有 registry.json（预期），跳过数据自检"
          fi

      - name: 构建冒烟
        run: go build ./...

  smoke:
    name: Smoke (uses: ./)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: test
    steps:
      - uses: actions/checkout@v5

      - name: Debug workspace
        run: |
          pwd
          ls -la
          cat action.yml | head -5

      # 只跑一个 command 先验证 uses: ./ 基本可用
      - name: doctor (smoke)
        id: doctor
        uses: ./
        with:
          command: doctor
          github-token: ${{ secrets.GITHUB_TOKEN }}