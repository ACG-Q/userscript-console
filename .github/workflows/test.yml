name: Test

on:
  push:
    branches: [master]
  pull_request: {}

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5   # TODO pin by sha（仓库惯例，见 SPEC-ACTION §4.6）

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: 格式（gofumpt 目标，先用 gofmt 把关）
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then echo "gofmt 需要格式化:"; echo "$out"; exit 1; fi

      - name: vet
        run: go vet ./...

      # TODO 集成阶段接入: golangci-lint run（govet/staticcheck/errcheck/ineffassign/gofumpt）
      # - name: lint
      #   uses: golangci/golangci-lint-action@v6
      #   with: { version: latest }

      - name: 测试 + 覆盖率
        run: |
          go test ./... -covermode=atomic -coverprofile=cover.out
          go tool cover -func=cover.out
          echo "--- total line ---"
          go tool cover -func=cover.out | tail -1
          pct=$(go tool cover -func=cover.out | tail -1 | grep -oE '[0-9.]+%' | tr -d '%')
          echo "pct='$pct'"
          awk -v p="$pct" 'BEGIN{exit !(p>=90)}'
          echo "coverage gate passed"

      - name: 快照基线
        run: go run ./cmd/usm snapshot check

      - name: 数据自检
        # doctor 面向**内容仓**的真实数据（registry.json / scripts/ / dist/）。
        # 本工具仓按设计不持有任何数据文件（README §1），故此处按需运行：
        # 仅当仓库根存在 registry.json 时才跑，避免把「无数据」误判为失败。
        run: |
          if [ -f registry.json ]; then
            go run ./cmd/usm doctor --check
          else
            echo "本仓不持有 registry.json（预期），跳过数据自检"
          fi

      - name: 构建冒烟
        run: go build ./...

  smoke:
    name: Smoke (uses: ./)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: test
    steps:
      - uses: actions/checkout@v5

      # 准备最小 registry.json 夹具（工具仓不持有数据，SPEC §5 自测要求）
      # 使用 printf 避免 echo 的实现差异，显式指定 UTF-8 无 BOM
      - name: Prepare fixture registry
        run: |
          printf '{"schema":1,"scripts":[]}\n' > registry.json
          cat registry.json | od -c | head -2  # 调试：确认无 BOM

      # 1. doctor --check（需 registry.json）
      - name: doctor
        id: doctor
        uses: ./
        with:
          command: doctor
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # 2. build（仅验证 action 执行与 JSON 输出合法；dist 不入库）
      - name: build
        id: build
        uses: ./
        with:
          command: build
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # 3. project（投影对账）
      - name: project
        id: project
        uses: ./
        with:
          command: project
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # 4. cleanup dry-run（默认不传 apply → dry-run，验证不删）
      - name: cleanup (dry-run)
        id: cleanup
        uses: ./
        with:
          command: cleanup
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # 5. run-command（列表命令，需注册夹具）
      - name: run-command /list
        id: run-command
        uses: ./
        with:
          command: run-command
          github-token: ${{ secrets.GITHUB_TOKEN }}
          comment-body: /list
          comment-user: ${{ github.repository_owner }}
          issue-number: '1'