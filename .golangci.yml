# golangci-lint 配置（SPEC-ARCH-TEST §4 门禁）
# Python 侧 ruff/mypy 的 Go 等价：0 issue；SA1019（弃用 API）与 errcheck 必开。
# v2 语法（golangci-lint v2.14.0 migrate 迁移；v1 注释在迁移中丢失后补回）。
version: "2"
linters:
  default: none
  enable:
    - errcheck
    - gocritic
    - govet
    - ineffassign
    - staticcheck
    - unused
  settings:
    errcheck:
      check-type-assertions: true
      check-blank: false
    gocritic:
      enabled-checks:
        - ifElseChain
        - singleCaseSwitch
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
issues:
  max-issues-per-linter: 0
  max-same-issues: 0
formatters:
  enable:
    - gofumpt
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
