
<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Userscript Console</title>
    <style>
        :root { --bg: #fafafa; --card-bg: #fff; --border: #e0e0e0; --text: #333; --muted: #666; --brand: #0969da; --brand-hover: #0860ca; --on-accent: #fff; }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif; background: var(--bg); color: var(--text); line-height: 1.6; }
        .container { max-width: 960px; margin: 0 auto; padding: 2rem 1rem; }
        h1 { margin-bottom: 1.5rem; font-size: 1.5rem; }
        .back { display: inline-block; margin-bottom: 1rem; font-size: 0.875rem; color: var(--brand); }
        .back:hover { text-decoration: none; }
        .filter-bar { display: flex; gap: 0.5rem; margin-bottom: 1rem; flex-wrap: wrap; }
        .filter-chip { font-size: 13px; padding: 7px 14px; border-radius: 999px; cursor: pointer; border: 1px solid var(--border); background: var(--bg); color: var(--text-muted); font-family: var(--font-ui); min-height: 34px; transition: border-color 0.15s ease, background 0.15s ease; }
        .filter-chip:hover { border-color: var(--border-strong); }
        .filter-chip.active { background: var(--brand); color: var(--on-accent); border-color: var(--brand); }
        .card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 12px; padding: 1.5rem; margin-bottom: 1.5rem; transition: border-color 0.15s ease; }
        .card:hover { border-color: var(--brand-fade); }
        .card-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 0.75rem; }
        .card h2 { font-size: 1.25rem; margin: 0; }
        .card h2 a { color: var(--text); text-decoration: none; }
        .card h2 a:hover { color: var(--brand); }
        .card .meta { color: var(--muted); font-size: 0.875rem; }
        .card .desc { margin-top: 0.5rem; color: var(--muted); font-size: 0.9rem; line-height: 1.5; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
        .badge { display: inline-block; padding: 0.25rem 0.5rem; border-radius: 6px; font-size: 0.75rem; font-weight: 500; }
        .badge-active { background: var(--info-bg); color: var(--info-text); }
        .badge-sync { background: var(--warn-bg); color: var(--warn-text); }
        .badge-ver { background: var(--bg-subtle); color: var(--text-muted); border: 1px solid var(--border); }
        .empty { padding: 3rem; text-align: center; color: var(--muted); }
        .load-more { text-align: center; padding: 1rem; }
        .load-more button { padding: 0.5rem 2rem; cursor: pointer; border: 1px solid var(--border); border-radius: 6px; background: var(--brand); color: var(--on-accent); font-size: 0.875rem; transition: opacity 0.15s ease; }
        .load-more button:hover { opacity: 0.9; }
        .load-more button:disabled { opacity: 0.5; cursor: not-allowed; }
    </style>
</head>
<body>
    <div class="container">
        <h1>脚本控制台</h1>
        <div class="filter-bar">
            <button class="filter-chip active" data-filter="all">全部</button>
            <button class="filter-chip" data-filter="self">自写</button>
            <button class="filter-chip" data-filter="synced">同步</button>
        </div>
        <div id="scriptList" data-total="2">
            
            <div class="card" data-id="11111111-2222-4333-8444-555555555555" data-type="self">
                <div class="card-header">
                    <h2><a href="/scripts/11111111-2222-4333-8444-555555555555">示例自写脚本</a>
                        <span class="badge badge-ver">已启用</span>
                        
                    </h2>
                </div>
                <div class="meta">v1.2.0 · self</div>
                <div class="desc">含 &lt;b&gt;HTML&lt;/b&gt; 与 &#34;引号&#34; 的描述</div>
            </div>
            
            <div class="card" data-id="abcdef012345" data-type="synced">
                <div class="card-header">
                    <h2><a href="/scripts/abcdef012345">示例同步脚本</a>
                        <span class="badge badge-ver">已停用</span>
                        
                    </h2>
                </div>
                <div class="meta">v2.0.0 · synced</div>
                <div class="desc">来自 GreasyFork 的同步脚本</div>
            </div>
            
            
        </div>
        
    </div>
    <script>
    (function(){
        var batch =  10 , total =  2 ;
        var shown = 0;
        var chips = document.querySelectorAll('.filter-chip');
        function setFilter(filter) {
            chips.forEach(function (c) { c.classList.toggle('active', c.dataset.filter === filter); });
            var cards = document.querySelectorAll('.card');
            cards.forEach(function (card) {
                var show = filter === 'all' || card.dataset.type === filter;
                card.hidden = !show;
            });
        }
        chips.forEach(function (c) { c.onclick = function () { setFilter(c.dataset.filter); }; });

        function loadMore() {
            var next = Math.min(shown + batch, total);
            var cards = document.querySelectorAll('.card');
            for (var i = shown; i < next; i++) {
                if (cards[i]) cards[i].style.display = '';
            }
            shown = next;
            if (shown >= total) document.getElementById('loadMore').style.display = 'none';
        }
        document.getElementById('loadMoreBtn').onclick = loadMore;
        loadMore();
    })();
    </script>
</body>
</html>
